name: error-free-text

services:
  postgres:
    image: postgres:15-alpine
    container_name: error-free-text-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-error_free_text}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-error_free_text}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
    container_name: error-free-text-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # внутри контейнера база доступна по имени сервиса postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-error_free_text}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_DDL_AUTO: ${DB_DDL_AUTO:-update}
      YANDEX_SPELLER_URL: ${YANDEX_SPELLER_URL:-https://speller.yandex.net/services/spellservice.json/checkTexts}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-5000}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
